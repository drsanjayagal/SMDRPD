[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smdrpd"
version = "1.0.0"
description = "Generator and tooling for the SMDRPD synthetic multimodal depression-risk dataset"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Dr. Sanjay Agal"},
]
keywords = [
    "synthetic data",
    "multimodal learning",
    "psychometric features",
    "facial expression representations",
    "depression risk prediction",
    "explainable AI",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=2.5.2,<3",
    "pandas>=3.0.6,<4",
    "scipy>=1.18.0,<2",
    "scikit-learn>=1.9.1,<2",
    "pyarrow>=16,<27",
    "matplotlib>=3.11,<4",
    "seaborn>=0.13,<0.14",
    "shap>=0.53.0,<0.55",
    "xgboost>=2.1,<3",
    "joblib>=1.3,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[project.scripts]
smdrpd-generate = "dataset_generator.generate_dataset:main"
smdrpd-validate = "preprocessing.data_validation:main"

[tool.setuptools]
packages = [
    "dataset_generator",
    "preprocessing",
    "benchmarking",
    "explainability",
    "evaluation",
    "visualization",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"